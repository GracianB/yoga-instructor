name: Yoga Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yoga-pages
  cancel-in-progress: true
jobs:
  node:
    name: Node release check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  browser:
    name: Deploy browser / ${{ matrix.browser }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install only this browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start virtual audio output
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=yoga_test
          pactl set-default-sink yoga_test
      - name: Test shard
        run: npm run test:browser -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --workers=3 --pass-with-no-tests
  deploy:
    needs: [node, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify production HTML and assets after deployment
        run: node tools/pages-smoke.mjs --attempts=30 --interval=5
