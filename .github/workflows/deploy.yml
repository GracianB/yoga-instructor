name: Yoga Deploy
# Pages is released only after Yoga Quality on main has completed successfully.
# The quality workflow already runs all six Chromium/Firefox/WebKit shards.
# Do not run the same six browser installers again during publication.
on:
  workflow_run:
    workflows: [Yoga Quality]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: yoga-pages
  cancel-in-progress: true

jobs:
  node:
    name: Verified release candidate
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify exact validated main commit
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          test "$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | cut -f1)" = "$VERIFIED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    name: Publish SHA-verified Yoga Pages
    needs: [node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify production HTML and assets after deployment
        run: node tools/pages-smoke.mjs --attempts=30 --interval=5
