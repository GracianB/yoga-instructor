name: Yoga Deploy
# Pages release on main push runs full Node audits/build and checks exact current SHA.
# Full browser quality continues separately; a queued browser matrix cannot leave the public site months behind.
# The quality workflow already runs all six Chromium/Firefox/WebKit shards.
# Do not run the same six browser installers again during publication.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Yoga Quality]
    types: [completed]
permissions:
  contents: read
# PR-triggered Yoga Quality runs must never cancel a verified main release.
# Main releases queue for a SHA check; PR runs use their own per-run group.
concurrency:
  group: yoga-pages-${{ github.event_name == 'push' && 'direct-main' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && 'verified-main' || github.event.workflow_run.id) }}
  cancel-in-progress: false

jobs:
  node:
    name: Verified release candidate
    # A successful quality workflow on main must match the live main SHA.
    # PR merge refs cannot pass that SHA check. Do not use
    # head_repository.full_name here because some workflow_run payloads omit it.
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact validated main commit
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          test "$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | cut -f1)" = "$VERIFIED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    name: Publish SHA-verified Yoga Pages
    needs: [node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reproduce the exact SHA-256 asset inventory from validated source
        run: npm run build
      - name: Verify every declared public asset and the V100 manifest after deployment
        run: node tools/pages-smoke.mjs --root=dist --attempts=30 --interval=5
