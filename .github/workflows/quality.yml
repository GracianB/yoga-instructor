name: Yoga Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: yoga-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    name: Yoga Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start virtual audio output
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=yoga_test
          pactl set-default-sink yoga_test
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: yoga-browser-report
          path: playwright-report/

  public-site:
    name: Published Pages Contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: main
          path: published-baseline
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check deployed main independently of pending PR changes
        run: node tools/pages-smoke.mjs --root=published-baseline --attempts=12 --interval=5
