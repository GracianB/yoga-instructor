name: Yoga Redesign Review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yoga-redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Current redesign interactions
        run: npm run test:browser -- --project=${{ matrix.browser }} --workers=2 tests/browser/yoga-chapters.spec.js tests/browser/movement-canvas.spec.js tests/browser/breath-extension.spec.js tests/browser/keyboard-practices.spec.js tests/browser/theme-sharing.spec.js tests/browser/asana-reference.spec.js tests/browser/lotus.spec.js
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: yoga-pr200-review-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
