name: Rive P0 experimental artifact
on:
  push:
    branches:
      - yoga-p0-anatomy-foundation
    paths:
      - 'rive-p0/**'
      - '.github/workflows/rive-p0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-rive:
    name: Verify and build Rive P0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Install Rive official CLI
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://releases.rive.app/cli/install.sh -o /tmp/install-rive.sh
          bash /tmp/install-rive.sh
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"

      - name: Install renderer shared libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 libx11-6

      - name: Verify source without publishing
        shell: bash
        run: rive rive-p0 --verify

      - name: Build local .riv without account
        shell: bash
        run: |
          rive rive-p0 --once
          test -s rive-p0/build/nila-yoga-p0.riv
          file rive-p0/build/nila-yoga-p0.riv

      - name: Inspect and render pose checkpoints
        shell: bash
        run: |
          rive inspect rive-p0 --summary
          mkdir -p rive-p0/build/frames
          rive rive-p0 --screenshot=rive-p0/build/frames/01-tadasana.png --advance=1
          rive rive-p0 --screenshot=rive-p0/build/frames/02-uttanasana.png --advance=60
          rive rive-p0 --screenshot=rive-p0/build/frames/03-hold.png --advance=100
          rive rive-p0 --screenshot=rive-p0/build/frames/04-return.png --advance=165
          ! cmp -s rive-p0/build/frames/01-tadasana.png rive-p0/build/frames/02-uttanasana.png
          cmp -s rive-p0/build/frames/01-tadasana.png rive-p0/build/frames/04-return.png

      - name: Upload Rive pose screenshots
        uses: actions/upload-artifact@v6
        with:
          name: nila-yoga-p0-screenshots
          path: rive-p0/build/frames/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit compiled demo to experimental branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/yoga-p0-anatomy-foundation'
        shell: bash
        env:
          TARGET_BRANCH: yoga-p0-anatomy-foundation
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          cp rive-p0/build/nila-yoga-p0.riv /tmp/nila-yoga-p0.riv
          git fetch origin "$TARGET_BRANCH"
          ACTUAL_HEAD="$(git rev-parse FETCH_HEAD)"
          if [ "$ACTUAL_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "Branch moved while building; skipping stale binary commit."
            exit 0
          fi
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          cp /tmp/nila-yoga-p0.riv rive-nila-demo-p0.riv
          git add rive-nila-demo-p0.riv
          if git diff --cached --quiet; then
            echo "Binary unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rive P0: version generated proof of concept"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Store binary proof for review
        uses: actions/upload-artifact@v6
        with:
          name: nila-yoga-p0-rive
          path: rive-p0/build/nila-yoga-p0.riv
          if-no-files-found: error
          retention-days: 7
