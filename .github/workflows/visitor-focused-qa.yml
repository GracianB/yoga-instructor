name: Yoga Visitor Journey Focused Quality
on:
  push:
    branches: [qa/yoga-visitor-experience-20261111]
permissions:
  contents: read
jobs:
  visitor:
    name: New visitor journeys / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify orientation, enquiry and FAQ in browser
        run: npm run test:browser -- tests/browser/visitor-orientation.spec.js --project=${{ matrix.browser }} --workers=2
      - name: Save screenshots and traces if something breaks
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: yoga-visitor-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
