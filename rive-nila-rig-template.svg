<title id="title">Nila · plantilla de rig vectorial para Rive</title>
<desc id="desc">Plantilla frontal con grupos separados de brazos, piernas, pelvis, tronco, cuello, cabeza, manos y pies. Importar en el editor Rive y asignar huesos.</desc>
